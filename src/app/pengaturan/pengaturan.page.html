<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button> </ion-menu-button>
    </ion-buttons>

    <ion-title> Pengaturan </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-list>
    <ion-item>
      <ion-checkbox
        labelPlacement="end"
        [checked]="getDarkMode()"
        (click)="toggleDarkMode()"
      >
        Mode Gelap
      </ion-checkbox>
    </ion-item>

    <ion-item>
      <ion-label>
        <p>Mode Aktif</p>

        <h2>{{ getThemeName() }}</h2>
      </ion-label>
    </ion-item>
  </ion-list>
</ion-content>
