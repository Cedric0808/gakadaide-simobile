<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>

    <ion-title> Transaksi </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-item>
    <ion-button expand="block" (click)="refreshData()">
      Refresh
    </ion-button>
  </ion-item>
  <ion-item *ngIf="transactions.length == 0">
    <ion-label> Belum ada transaksi. </ion-label>
  </ion-item>
  <ion-list>
    <ion-item *ngFor="let transaction of transactions" routerLink="/detail-transaksi/{{transaction.id}}">
      <ion-label>
        <h2>Transaksi #{{ transaction.id }}</h2>

        <p>Tanggal: {{ transaction.date }}</p>

        <p>Total: Rp {{ transaction.total }}</p>
      </ion-label>
    </ion-item>
  </ion-list>
</ion-content>
