<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/transaksi"> </ion-back-button>
    </ion-buttons>

    <ion-title> Detail Transaksi </ion-title>
  </ion-toolbar>
</ion-header>


<ion-content [fullscreen]="true">
  <ion-list *ngIf="detailTransaction">
    <ion-item>
      <ion-label>
        <h1>Transaksi #{{ detailTransaction.id }}</h1>

        <p>Tanggal: {{ detailTransaction.date }}</p>

      </ion-label>
    </ion-item>

    <ion-item *ngFor="let item of detailTransaction.items">
      <ion-label>
        <h2>{{ item.name }}</h2>

        <p>Kategori: {{ item.category }}</p>
        <p>Harga: Rp {{ item.sellingPrice }}</p>
        <p>Jumlah: {{ item.quantity }}</p>
      </ion-label>
    </ion-item>
    <ion-item>
      <ion-label>
        <h2>Total: Rp {{ detailTransaction.total }}</h2>
      </ion-label>
    </ion-item>

  </ion-list>

</ion-content>
