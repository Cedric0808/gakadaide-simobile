<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/produk"></ion-back-button>
    </ion-buttons>
    <ion-title>Keranjang</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-item>
    <ion-button expand="block" (click)="refreshData()">
      Refresh
    </ion-button>
  </ion-item>
  <ion-list>
    <ion-item *ngFor="let item of cartItems, let i = index">
      <ion-label>
        <h2>{{ item.name }}</h2>

        <p>Harga: Rp {{ item.sellingPrice }}</p>
        <p>Jumlah: {{ quantityPurchased[i] }}</p>
      </ion-label>
    </ion-item>
  </ion-list>
  <ion-item>
    <ion-label>
      <h2>Total Belanja: Rp {{ getTotal() }}</h2>
    </ion-label>
  </ion-item>

  <ion-item>
    <ion-button expand="block" [disabled]="cartItems.length == 0" (click)="confirmTransaction()">
      Konfirmasi Transaksi
    </ion-button>
  </ion-item>
  
  <ion-item *ngIf="message != ''">
    <ion-label> {{ message }} </ion-label>
  </ion-item>

</ion-content>
