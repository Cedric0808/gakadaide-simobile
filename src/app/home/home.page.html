<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>

    <ion-title> Dashboard </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-item>
    <ion-button expand="block" (click)="refreshData()">
      Refresh
    </ion-button>
  </ion-item>
  <div id="dashboardAnimation">
    <ion-item>
      <ion-label>
        <p>Jumlah Produk</p>

        <h1>{{ productCount }}</h1>
      </ion-label>
    </ion-item>

    <ion-item>
      <ion-label>
        <p>Total Transaksi Hari Ini</p>

        <h1>{{ transactionCount }}</h1>
      </ion-label>
    </ion-item>

    <ion-item>
      <ion-label>
        <p>Total Pendapatan Hari Ini</p>

        <h1>Rp {{ todayRevenue }}</h1>
      </ion-label>
    </ion-item>

    <ion-item>
      <ion-label>
        <p>Produk Terlaris</p>

        <h2>{{ bestSellingProduct }}</h2>
      </ion-label>
    </ion-item>
  </div>
</ion-content>
