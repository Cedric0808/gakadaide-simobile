<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/produk"></ion-back-button>
    </ion-buttons>

    <ion-title>Detail Produk</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-list *ngIf="detailProduct">
    <ion-item>
      <ion-img class="product-image" [src]="getProductImage()"> </ion-img>
    </ion-item>
    <ion-item>
      <ion-label>
        <h1>{{ detailProduct.name }}</h1>
      </ion-label>
    </ion-item>

    <ion-item>
      <ion-label> Kategori: {{ detailProduct.category }} </ion-label>
    </ion-item>

    <ion-item>
      <ion-label> Stok: {{ detailProduct.stock }} </ion-label>
    </ion-item>

    <ion-item>
      <ion-label> Harga Beli: Rp {{ detailProduct.purchasePrice }} </ion-label>
    </ion-item>

    <ion-item>
      <ion-label> Harga Jual: Rp {{ detailProduct.sellingPrice }} </ion-label>
    </ion-item>
  </ion-list>
</ion-content>
